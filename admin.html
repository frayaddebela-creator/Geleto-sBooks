<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inkbound - Admin</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',sans-serif; background:#fdf8f2; color:#2e241b; padding:2rem; }
    .container { max-width:700px; margin:0 auto; }
    .card { background:white; border-radius:16px; padding:2rem; margin-bottom:1.5rem; box-shadow:0 4px 20px rgba(0,0,0,0.06); }
    h1, h2 { font-family:Georgia,serif; color:#5e3e2c; margin-bottom:1rem; }
    label { display:block; font-weight:600; margin:0.5rem 0 0.2rem; }
    input, select, textarea { width:100%; padding:0.7rem; border:2px solid #e4d5c3; border-radius:10px; font-size:1rem; font-family:inherit; margin-bottom:0.5rem; }
    textarea { min-height:60px; resize:vertical; }
    button { padding:0.7rem 1.5rem; border-radius:25px; border:none; cursor:pointer; font-weight:600; background:#5e3e2c; color:white; font-size:1rem; }
    button:hover { background:#4a2f1f; }
    .file-box { border:3px dashed #e4d5c3; border-radius:14px; padding:1.5rem; text-align:center; cursor:pointer; margin-bottom:0.5rem; }
    .msg { padding:0.8rem; border-radius:10px; margin:1rem 0; display:none; }
    .msg.success { background:#d4edda; color:#155724; display:block; }
    .msg.error { background:#f8d7da; color:#721c24; display:block; }
    .book-item { display:flex; justify-content:space-between; align-items:center; padding:0.8rem; border-bottom:1px solid #eee; }
    .btn-sm { padding:0.3rem 0.8rem; font-size:0.8rem; background:#c0392b; }
  </style>
</head>
<body>

<div class="container">
  <h1>📤 Admin Upload</h1>
  <div id="msg" class="msg"></div>

  <div class="card">
    <h2>Add Book</h2>
    <label>Title *</label><input type="text" id="title">
    <label>Author *</label><input type="text" id="author">
    <label>Genre</label><select id="genre"><option>fiction</option><option>education</option><option>history</option><option>science</option><option>fantasy</option></select>
    <label>Description</label><textarea id="desc"></textarea>
    <label>Book File (PDF) *</label>
    <div class="file-box" onclick="document.getElementById('file').click()">📁 Click to select PDF</div>
    <input type="file" id="file" accept=".pdf" style="display:none;">
    <p id="fileName" style="color:green;"></p>
    <button onclick="upload()">📤 Upload to Cloud</button>
  </div>

  <div class="card">
    <h2>Library (<span id="count">0</span>)</h2>
    <div id="list">Loading...</div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC1dl0DlXBF1baPplTghtHeH3syvhW2FjA",
  authDomain: "books-by-geleto.firebaseapp.com",
  projectId: "books-by-geleto",
  storageBucket: "books-by-geleto.firebasestorage.app",
  messagingSenderId: "262058617349",
  appId: "1:262058617349:web:7082589ccc25bd83f00a6c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

let selectedFile = null;

document.getElementById('file').addEventListener('change', function(e){
  selectedFile = e.target.files[0];
  document.getElementById('fileName').textContent = selectedFile ? '✅ '+selectedFile.name : '';
});

function msg(t,c){ const m=document.getElementById('msg'); m.textContent=t; m.className='msg '+c; setTimeout(()=>m.className='msg',3000); }

async function upload(){
  const title = document.getElementById('title').value.trim();
  const author = document.getElementById('author').value.trim();
  if(!title||!author){ msg('Title and author required','error'); return; }
  if(!selectedFile){ msg('Select a PDF file','error'); return; }

  msg('Uploading...','success');
  try{
    const ref = storage.ref('books/'+Date.now()+'_'+selectedFile.name);
    const task = ref.put(selectedFile);
    task.on('state_changed', null, err=>{ msg('Error: '+err.message,'error'); },
      async ()=>{
        const url = await task.snapshot.ref.getDownloadURL();
        await db.collection('books').add({
          title, author,
          genre: document.getElementById('genre').value,
          description: document.getElementById('desc').value.trim(),
          fileName: selectedFile.name,
          fileURL: url,
          pages:0, year:2024, language:'English', rating:0, reviews:[], available:true,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        document.getElementById('title').value='';
        document.getElementById('author').value='';
        document.getElementById('desc').value='';
        document.getElementById('file').value='';
        document.getElementById('fileName').textContent='';
        selectedFile=null;
        msg('✅ Book uploaded!','success');
        loadBooks();
      }
    );
  }catch(e){ msg('Error: '+e.message,'error'); }
}

async function loadBooks(){
  const list=document.getElementById('list');
  try{
    const snap = await db.collection('books').orderBy('createdAt','desc').get();
    const books=[]; snap.forEach(d=>books.push({id:d.id,...d.data()}));
    document.getElementById('count').textContent=books.length;
    list.innerHTML = books.length ? books.map(b=>
      `<div class="book-item"><span><strong>${b.title}</strong> by ${b.author} 📄</span><button class="btn-sm" onclick="del('${b.id}')">Delete</button></div>`
    ).join('') : '<p>No books yet.</p>';
  }catch(e){ list.innerHTML='<p style="color:red;">Error loading</p>'; }
}

async function del(id){
  if(confirm('Delete?')){ await db.collection('books').doc(id).delete(); loadBooks(); }
}

loadBooks();
</script>
</body>
</html>
