<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inkbound - Discover Books</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --bg:#fdf8f2; --card:#fffbf5; --text:#2e241b; --accent:#5e3e2c; --border:#e4d5c3; --shadow:0 4px 15px rgba(0,0,0,0.06); }
    body.dark-mode { --bg:#1a1a2e; --card:#252540; --text:#e0d6c8; --accent:#c4956a; --border:#3a3a55; }
    body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; transition:0.3s; }
    .navbar { background:var(--card); padding:1rem 2rem; position:sticky; top:0; z-index:100; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; border-bottom:1px solid var(--border); }
    .logo { font-family:Georgia,serif; font-size:1.6rem; font-weight:bold; color:#1e3b4a; text-decoration:none; }
    body.dark-mode .logo { color:#c4956a; }
    .nav-links { display:flex; gap:1.5rem; align-items:center; flex-wrap:wrap; }
    .nav-links a { text-decoration:none; color:var(--text); font-weight:500; font-size:0.9rem; }
    .nav-links a:hover { color:var(--accent); }
    .btn { padding:0.5rem 1.3rem; border-radius:25px; border:none; cursor:pointer; font-weight:600; font-size:0.9rem; }
    .btn-primary { background:var(--accent); color:white; }
    .hero { background:linear-gradient(135deg,#1e3b4a,#2c5a6e); color:white; padding:3rem 2rem; text-align:center; border-radius:0 0 40px 40px; margin-bottom:2rem; }
    .hero h1 { font-family:Georgia,serif; font-size:2.5rem; }
    .search-container { max-width:650px; margin:-25px auto 2rem; padding:0 1rem; }
    .search-box { display:flex; background:white; border-radius:50px; padding:0.3rem; box-shadow:0 8px 30px rgba(0,0,0,0.12); }
    .search-box input { flex:1; border:none; padding:1rem 1.5rem; font-size:1rem; outline:none; border-radius:50px 0 0 50px; }
    .search-box button { background:var(--accent); color:white; border:none; padding:0.8rem 2rem; border-radius:50px; cursor:pointer; margin:0.2rem; }
    .container { max-width:1200px; margin:0 auto; padding:0 1.5rem; }
    .book-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:1.5rem; margin:2rem 0 3rem; }
    .book-card { background:var(--card); border-radius:16px; padding:1rem; box-shadow:var(--shadow); border:1px solid var(--border); cursor:pointer; transition:0.2s; }
    .book-card:hover { transform:translateY(-6px); }
    .cover { width:100%; aspect-ratio:2/3; border-radius:10px; background:linear-gradient(135deg,#c4a882,#8b6f55); display:flex; align-items:center; justify-content:center; font-size:3rem; color:white; margin-bottom:0.8rem; }
    .book-title { font-weight:700; font-size:0.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .book-author { font-size:0.8rem; color:var(--text); opacity:0.7; }
    .stars { color:#e6a817; font-size:0.8rem; }
    .footer { background:#1e3b4a; color:white; text-align:center; padding:2rem; margin-top:3rem; }
    @media(max-width:600px){ .book-grid{grid-template-columns:repeat(2,1fr);} }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">📚 Ink<span>bound</span></a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="browse.html">Browse</a>
    <a href="community.html">Community</a>
    <a href="about.html">About</a>
    <button onclick="toggleDark()" style="background:none;border:none;font-size:1.2rem;cursor:pointer;">🌙</button>
    <a href="account.html" class="btn btn-primary">Account</a>
  </div>
</nav>

<div class="hero"><h1>Discover Your Next Great Read</h1><p>Browse books uploaded by our community</p></div>

<div class="search-container">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search by title or author...">
    <button onclick="search()">🔍 Search</button>
  </div>
</div>

<div class="container">
  <div class="book-grid" id="bookGrid"><p style="text-align:center;grid-column:1/-1;">Loading books...</p></div>
</div>

<div class="footer"><p>© 2025 Inkbound — Public Bookshelf</p></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC1dl0DlXBF1baPplTghtHeH3syvhW2FjA",
  authDomain: "books-by-geleto.firebaseapp.com",
  projectId: "books-by-geleto",
  storageBucket: "books-by-geleto.firebasestorage.app",
  messagingSenderId: "262058617349",
  appId: "1:262058617349:web:7082589ccc25bd83f00a6c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let allBooks = [];
let searchQuery = '';

async function loadBooks(){
  const snap = await db.collection('books').orderBy('createdAt','desc').get();
  allBooks = []; snap.forEach(d => allBooks.push({id:d.id,...d.data()}));
}

function render(){
  let f = [...allBooks];
  if(searchQuery){
    const q = searchQuery.toLowerCase();
    f = f.filter(b => (b.title||'').toLowerCase().includes(q) || (b.author||'').toLowerCase().includes(q));
  }
  const grid = document.getElementById('bookGrid');
  if(f.length===0){
    grid.innerHTML = '<p style="text-align:center;grid-column:1/-1;padding:3rem;">No books yet. <a href="admin.html">Upload one!</a></p>';
    return;
  }
  grid.innerHTML = f.slice(0,8).map(b => `
    <div class="book-card" onclick="location.href='book-detail.html?id=${b.id}'">
      <div class="cover">📖</div>
      <div class="book-title">${b.title||'Untitled'}</div>
      <div class="book-author">${b.author||'Unknown'}</div>
      <div class="stars">★ ${b.rating||'0'}</div>
    </div>
  `).join('');
}

function search(){ searchQuery = document.getElementById('searchInput').value.trim(); render(); }
document.getElementById('searchInput').addEventListener('keyup', e => { if(e.key==='Enter')search(); });

function toggleDark(){
  document.body.classList.toggle('dark-mode');
  localStorage.setItem('inkbound_darkmode', document.body.classList.contains('dark-mode'));
}
if(localStorage.getItem('inkbound_darkmode')==='true') document.body.classList.add('dark-mode');

(async function(){
  try{ await loadBooks(); render(); } catch(e){ document.getElementById('bookGrid').innerHTML='<p style="color:red;">Error loading. Check console.</p>'; console.error(e); }
})();
</script>
</body>
</html>
