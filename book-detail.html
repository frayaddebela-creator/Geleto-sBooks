<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inkbound - Read</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',sans-serif; background:#fdf8f2; color:#2e241b; }
    .navbar { background:white; padding:1rem 2rem; border-bottom:1px solid #e4d5c3; }
    .navbar a { color:#5e3e2c; text-decoration:none; font-weight:bold; font-size:1.3rem; }
    .container { max-width:800px; margin:2rem auto; padding:0 1.5rem; }
    .card { background:white; border-radius:16px; padding:2rem; box-shadow:0 4px 20px rgba(0,0,0,0.06); }
    h1 { font-family:Georgia,serif; color:#5e3e2c; }
    .btn { padding:0.7rem 1.5rem; border-radius:25px; border:none; cursor:pointer; font-weight:600; background:#5e3e2c; color:white; font-size:1rem; margin-top:1rem; }
    .reader-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#323639; z-index:9999; }
    .reader-overlay.active { display:block; }
    .reader-toolbar { padding:0.8rem 1.5rem; background:#1e1e1e; color:white; display:flex; justify-content:space-between; }
    .reader-body { height:calc(100% - 50px); }
    .reader-body iframe { width:100%; height:100%; border:none; }
  </style>
</head>
<body>

<nav class="navbar"><a href="index.html">📚 Inkbound</a></nav>

<div class="container">
  <div class="card" id="detail"><p>Loading book...</p></div>
</div>

<div class="reader-overlay" id="reader">
  <div class="reader-toolbar">
    <span id="rTitle">Reading...</span>
    <button onclick="closeReader()" style="background:white;color:#333;padding:0.3rem 1rem;border-radius:5px;border:none;cursor:pointer;">Close</button>
  </div>
  <div class="reader-body" id="rBody"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC1dl0DlXBF1baPplTghtHeH3syvhW2FjA",
  authDomain: "books-by-geleto.firebaseapp.com",
  projectId: "books-by-geleto",
  storageBucket: "books-by-geleto.firebasestorage.app",
  messagingSenderId: "262058617349",
  appId: "1:262058617349:web:7082589ccc25bd83f00a6c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const params = new URLSearchParams(window.location.search);
const bookId = params.get('id');
let book = null;

async function load(){
  if(!bookId) return;
  const doc = await db.collection('books').doc(bookId).get();
  if(!doc.exists){ document.getElementById('detail').innerHTML='<p>Book not found.</p>'; return; }
  book = {id:doc.id,...doc.data()};
  document.getElementById('detail').innerHTML = `
    <h1>${book.title}</h1>
    <p><strong>${book.author}</strong> · ${book.genre} · ${book.pages}p · ${book.year}</p>
    <p style="margin:1rem 0;">${book.description||''}</p>
    ${book.fileName?`<p>📄 ${book.fileName}</p>`:''}
    <button class="btn" onclick="openReader()">📖 Read Online</button>
  `;
}

function openReader(){
  if(!book||!book.fileURL) return;
  document.getElementById('reader').classList.add('active');
  document.getElementById('rTitle').textContent = book.title;
  document.getElementById('rBody').innerHTML = `<iframe src="${book.fileURL}"></iframe>`;
}

function closeReader(){ document.getElementById('reader').classList.remove('active'); }
document.addEventListener('keydown', e => { if(e.key==='Escape') closeReader(); });

load();
</script>
</body>
</html>
